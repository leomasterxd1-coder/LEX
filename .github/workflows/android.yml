name: Build LEX APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build arm64-v8a release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lex-release.jks"
            echo "Release keystore ready."
          else
            echo "No signing keystore secret set; release will use the debug key."
          fi

      - name: Build release APK
        env:
          LEX_KEYSTORE_PATH: ${{ runner.temp }}/lex-release.jks
          LEX_KEYSTORE_PASSWORD: ${{ secrets.LEX_KEYSTORE_PASSWORD }}
          LEX_KEY_ALIAS: ${{ secrets.LEX_KEY_ALIAS }}
          LEX_KEY_PASSWORD: ${{ secrets.LEX_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          cp app/build/outputs/apk/release/app-release.apk "dist/LEX-${VERSION}-arm64-v8a.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEX-release-apk
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: LEX ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          body: |
            LEX ${{ github.ref_name }} — build Jetpack Compose independente.

            - Pacote: com.lex.app
            - Versão: 1.0.7 (8)
            - ABI: arm64-v8a
            - minSdk: 29 / targetSdk: 36
            - Interface 100% em português do Brasil (pt-BR)
            - APK release assinado em anexo.
            - PDF e digitalização processados em segundo plano; APK otimizado com R8.
            - Impressão direta via IP (IPP/porta 9100), sem a janela nativa do Android.
            - Ícones originais portados para a tela inicial, com textos corrigidos.
            - Correção definitiva do retorno para a aba Início.
            - Margens do PDF reduzidas, geração de PostScript e diagnóstico de impressão direta por IP.
            - Produzido por Leo Lopes.

            O LEX é um projeto independente e não é afiliado, endossado ou patrocinado pela Lexmark.
